name: Block PRs with specific labels

on:
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize, reopened]

jobs:
  check-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check for "B2 - Block" label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelToBlock = "B2 - Block";
            const prNumber = context.payload.pull_request.number;

            // log all the labels on the PR
            console.log(`Listing labels for PR ${prNumber}`);
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
            });

            console.log(`Labels on PR ${prNumber}: ${JSON.stringify(labels)}`);

            const hasBlockLabel = labels.some(label => label.name === labelToBlock);

            if (hasBlockLabel) {
              core.setFailed(`PR cannot be merged because it has the label "${labelToBlock}"`);
            }
